name: shop-service

services:
  shop-service:
    build:
      context: ..
      dockerfile: shop-service/Dockerfile
    container_name: shop-service
    ports:
      - "${SHOP_SERVICE_PORT:-8088}:8088"
    environment:
      - DB_HOST=shop-postgres
      - DB_PORT=5432
      - DB_NAME=shop_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - REDIS_HOST=shop-redis
      - REDIS_PORT=6379
      - WALLET_SERVICE_URL=${WALLET_SERVICE_URL:-http://wallet-service:8089}
      - PAYOS_CLIENT_ID=${PAYOS_CLIENT_ID:-}
      - PAYOS_API_KEY=${PAYOS_API_KEY:-}
      - PAYOS_CHECKSUM_KEY=${PAYOS_CHECKSUM_KEY:-}
    depends_on:
      shop-postgres:
        condition: service_healthy
      shop-redis:
        condition: service_healthy


  shop-postgres:
    image: postgres:16
    container_name: shop-postgres
    restart: unless-stopped
    ports:
      - "${SHOP_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    volumes:
      - shop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  shop-redis:
    image: redis:7-alpine
    container_name: shop-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - shop-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  shop-postgres-data:
  shop-redis-data:

networks:
  default:
    name: poker-network
