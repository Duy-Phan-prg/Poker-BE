spring.application.name=matchmaking-service
server.port=${SERVER_PORT:8083}
management.endpoints.web.exposure.include=health,info

# PostgreSQL owned by matchmaking-service
spring.datasource.url=${MATCHMAKING_DB_URL:jdbc:postgresql://localhost:5432/matchmaking_db}
spring.datasource.username=${MATCHMAKING_DB_USER:poker}
spring.datasource.password=${MATCHMAKING_DB_PASSWORD:poker_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Redis is private to matchmaking-service and stores transient queue state.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Shared RabbitMQ from docker/compose.infra.yml. Do not create a private broker.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Internal service URLs. Containers resolve these names on the default network.
matchmaking.ranking-url=${RANKING_SERVICE_URL:http://localhost:8086}
matchmaking.wallet-url=${WALLET_SERVICE_URL:http://localhost:8089}
matchmaking.game-url=${GAME_SERVICE_URL:http://localhost:8082}
matchmaking.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8081}
