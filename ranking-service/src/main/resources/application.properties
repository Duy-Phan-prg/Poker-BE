spring.application.name=ranking-service
server.port=${SERVER_PORT:8086}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${RANKING_DB_URL:jdbc:postgresql://localhost:5432/ranking_db}
spring.datasource.username=${RANKING_DB_USER:poker}
spring.datasource.password=${RANKING_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
ranking.events.enabled=${RANKING_EVENTS_ENABLED:true}
